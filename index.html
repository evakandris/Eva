<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eva Kandris</title>
    <style>
      :root {
        --bg1: #ccd5e3;
        --bg2: #e4e6ee;
        --card: rgba(245, 244, 240, 0.92);
        --blue-top: #3f5aa8;
        --blue-bottom: #4057a6;
        --ink: #261f1f;
        --footer-text: rgba(255,255,255,0.98);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      }

      body {
        display: grid;
        place-items: center;
        padding: 26px;
      }

      .frame {
        width: min(94vw, 1200px);
        display: block;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <img src="eva-card.svg" alt="Eva Kandris business card" />
    </div>
  </body>
</html>
